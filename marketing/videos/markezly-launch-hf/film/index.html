<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #e6ebf1; }
      #root { width: 100%; height: 100%; position: relative; }
    </style>
  </head>
  <body>
    <!-- Markezly launch film, storyline A "One transfer, followed" (SPEC.md). English cut.
         index-ar.html is the Arabic cut, generated by ../scripts/make-ar.mjs: identical except each scene's lang. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="34.5" data-width="1080" data-height="1920">
      <div id="chat" class="clip" data-composition-id="chat" data-composition-src="compositions/chat.html"
        data-start="0" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"
        data-variable-values='{"lang":"en"}'></div>
      <div id="record" class="clip" data-composition-id="record" data-composition-src="compositions/record.html"
        data-start="6" data-duration="10.45" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"
        data-variable-values='{"lang":"en"}'></div>
      <div id="ledger" class="clip" data-composition-id="ledger" data-composition-src="compositions/ledger.html"
        data-start="16.45" data-duration="5.55" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"
        data-variable-values='{"lang":"en"}'></div>
      <div id="payoff" class="clip" data-composition-id="payoff" data-composition-src="compositions/payoff.html"
        data-start="22" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"
        data-variable-values='{"lang":"en"}'></div>
      <div id="endcard" class="clip" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="30" data-duration="4.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"
        data-variable-values='{"lang":"en"}'></div>

      <!-- Music: the first Markezly launch film's original score (120 BPM), spliced on bar lines:
           score 0-21 under the story (its brand impact at 5.0 lands on the reveal at 6.0),
           score 41-53.5 from the payoff (its final impact at 49 lands on the end card at 30.0). -->
      <audio id="score-a" class="clip" src="assets/audio/score.m4a" data-start="1" data-media-start="0" data-duration="21"
        data-track-index="3" data-volume="0.9" data-fade-out="0.12"></audio>
      <audio id="score-b" class="clip" src="assets/audio/score.m4a" data-start="22" data-media-start="41" data-duration="12.5"
        data-track-index="3" data-volume="0.9" data-fade-in="0.03" data-fade-out="1.2"></audio>

      <!-- Effects: each one has a cause on screen. -->
      <audio id="sfx-tick-receipt" class="clip" src="assets/audio/tick.wav" data-start="0.25" data-duration="0.035" data-track-index="4" data-volume="0.7"></audio>
      <audio id="sfx-pile-1" class="clip" src="assets/audio/tick.wav" data-start="3.38" data-duration="0.035" data-track-index="4" data-volume="0.6"></audio>
      <audio id="sfx-pile-2" class="clip" src="assets/audio/tick.wav" data-start="3.88" data-duration="0.035" data-track-index="4" data-volume="0.6"></audio>
      <audio id="sfx-pile-3" class="clip" src="assets/audio/tick.wav" data-start="4.38" data-duration="0.035" data-track-index="4" data-volume="0.6"></audio>
      <audio id="sfx-pile-4" class="clip" src="assets/audio/tick.wav" data-start="4.71" data-duration="0.035" data-track-index="4" data-volume="0.6"></audio>
      <audio id="sfx-morph" class="clip" src="assets/audio/whoosh.wav" data-start="6.05" data-duration="0.55" data-track-index="4" data-volume="0.55"></audio>
      <audio id="sfx-tap-amount" class="clip" src="assets/audio/click.wav" data-start="11.3" data-duration="0.06" data-track-index="4" data-volume="0.8"></audio>
      <audio id="sfx-tap-method" class="clip" src="assets/audio/click.wav" data-start="12.4" data-duration="0.06" data-track-index="4" data-volume="0.8"></audio>
      <audio id="sfx-tap-ref" class="clip" src="assets/audio/click.wav" data-start="13.4" data-duration="0.06" data-track-index="4" data-volume="0.8"></audio>
      <audio id="sfx-tap-status" class="clip" src="assets/audio/click.wav" data-start="15.3" data-duration="0.06" data-track-index="4" data-volume="0.8"></audio>
      <audio id="sfx-tap-save" class="clip" src="assets/audio/click.wav" data-start="16.25" data-duration="0.06" data-track-index="4" data-volume="0.8"></audio>
      <audio id="sfx-carry" class="clip" src="assets/audio/whoosh.wav" data-start="16.5" data-duration="0.55" data-track-index="4" data-volume="0.5"></audio>
      <audio id="sfx-tap-confirm" class="clip" src="assets/audio/click.wav" data-start="19.2" data-duration="0.06" data-track-index="4" data-volume="0.8"></audio>
      <audio id="sfx-confirmed" class="clip" src="assets/audio/chime.wav" data-start="19.3" data-duration="0.7" data-track-index="4" data-volume="0.7"></audio>
      <audio id="sfx-chip-out" class="clip" src="assets/audio/whoosh.wav" data-start="21.4" data-duration="0.55" data-track-index="4" data-volume="0.5"></audio>
      <audio id="sfx-chip-collected" class="clip" src="assets/audio/tick.wav" data-start="22.45" data-duration="0.035" data-track-index="4" data-volume="0.8"></audio>
      <audio id="sfx-whip-finance" class="clip" src="assets/audio/whoosh.wav" data-start="23.9" data-duration="0.55" data-track-index="4" data-volume="0.5"></audio>
      <audio id="sfx-chip-payables" class="clip" src="assets/audio/tick.wav" data-start="24.95" data-duration="0.035" data-track-index="4" data-volume="0.8"></audio>
      <audio id="sfx-whip-student" class="clip" src="assets/audio/whoosh.wav" data-start="26.7" data-duration="0.55" data-track-index="4" data-volume="0.5"></audio>
      <audio id="sfx-logo" class="clip" src="assets/audio/thump.wav" data-start="30.8" data-duration="0.6" data-track-index="4" data-volume="0.7"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
